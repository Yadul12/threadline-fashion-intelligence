<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620">
  <rect width="1200" height="620" fill="#FAF8F5" />
  <!-- Header Title -->
  <text x="40" y="42" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#181615">
    THREADLINE — Figma Component &amp; Wireframe Specification Sheet
  </text>
  <text x="40" y="64" font-family="monospace" font-size="11" fill="#655E57">
    Import directly into Figma · Palette: #FAF8F5 (Canvas) · #181615 (Charcoal) · #7C2D26 (Burgundy) · #2E5A3C (Statistical Winner)
  </text>

  <!-- Frame 1: Storefront Product Card (Treatment Variant) -->
  <g transform="translate(40, 90)">
    <rect width="320" height="480" fill="#FFFFFF" stroke="#181615" stroke-width="1.5" />
    <rect x="0" y="0" width="320" height="330" fill="#EFECE6" />
    <rect x="12" y="12" width="84" height="20" fill="#181615" />
    <text x="20" y="26" font-family="monospace" font-size="10" fill="#FAF8F5">NEW SEASON</text>
    <rect x="12" y="38" width="52" height="20" fill="#7C2D26" />
    <text x="20" y="52" font-family="monospace" font-size="10" fill="#FFFFFF">-15%</text>
    <!-- Treatment Fit Callout -->
    <rect x="0" y="298" width="320" height="32" fill="#FFF5F2" stroke="#E8C5BE" />
    <text x="12" y="318" font-family="monospace" font-size="10" fill="#7C2D26">FIT: RUNS SMALL - SIZE UP · SIZE S IN STOCK</text>
    <!-- Card Metadata -->
    <text x="16" y="356" font-family="monospace" font-size="10" fill="#655E57">ATELIER VANCE · ★ 4.3 (12)</text>
    <text x="16" y="382" font-family="Georgia, serif" font-size="17" fill="#181615">Solstice Pleated Linen Trouser</text>
    <text x="16" y="404" font-family="sans-serif" font-size="11" fill="#655E57">100% European Flax Linen</text>
    <line x1="16" y1="422" x2="304" y2="422" stroke="#EFECE6" />
    <text x="16" y="452" font-family="monospace" font-size="14" font-weight="bold" fill="#181615">₹4,490</text>
    <rect x="216" y="432" width="88" height="28" fill="#181615" />
    <text x="232" y="450" font-family="monospace" font-size="10" fill="#FFFFFF">+ ADD (S)</text>
  </g>

  <!-- Frame 2: PM Workspace Funnel & Experiment Module -->
  <g transform="translate(400, 90)">
    <rect width="760" height="480" fill="#F4F3F0" stroke="#E2E0DC" stroke-width="1.5" />
    <!-- Sidebar -->
    <rect x="0" y="0" width="160" height="480" fill="#141413" />
    <text x="16" y="32" font-family="monospace" font-size="11" font-weight="bold" fill="#D4B895">THREADLINE · PM</text>
    <rect x="8" y="54" width="144" height="28" fill="#22201E" />
    <text x="18" y="72" font-family="sans-serif" font-size="11" fill="#FFFFFF">1. Product Overview</text>
    <text x="18" y="104" font-family="sans-serif" font-size="11" fill="#A59E95">2. Customer Funnel</text>
    <text x="18" y="132" font-family="sans-serif" font-size="11" fill="#A59E95">3. Search Intelligence</text>
    <text x="18" y="160" font-family="sans-serif" font-size="11" fill="#A59E95">4. GenAI Feedback VoC</text>
    <text x="18" y="188" font-family="sans-serif" font-size="11" fill="#A59E95">5. A/B Experiments</text>
    <text x="18" y="216" font-family="sans-serif" font-size="11" fill="#A59E95">6. RICE Roadmap</text>

    <!-- Main PM Canvas -->
    <rect x="180" y="20" width="560" height="80" fill="#FFFFFF" stroke="#E2E0DC" />
    <text x="196" y="44" font-family="monospace" font-size="10" fill="#7C2D26">CONTROLLED EXPERIMENT · EXP_SEMANTIC_SIZE_FIT_FILTERS</text>
    <text x="196" y="68" font-family="Georgia, serif" font-size="18" fill="#181615">Semantic Search + Sticky Size &amp; Fit Filter Bar</text>
    <rect x="520" y="32" width="204" height="32" fill="#F4F9F5" stroke="#2E5A3C" />
    <text x="530" y="52" font-family="monospace" font-size="10" font-weight="bold" fill="#2E5A3C">WINNER (p &lt; 0.05 · CI +8%..+31%)</text>

    <!-- Funnel Bars -->
    <rect x="180" y="116" width="560" height="340" fill="#FFFFFF" stroke="#E2E0DC" />
    <text x="196" y="144" font-family="Georgia, serif" font-size="16" fill="#181615">8-Step Customer Discovery &amp; Conversion Funnel</text>
    <rect x="196" y="166" width="480" height="22" fill="#181615" />
    <text x="204" y="181" font-family="monospace" font-size="10" fill="#FFFFFF">1. homepage_viewed (100%)</text>
    <rect x="196" y="200" width="380" height="22" fill="#181615" />
    <text x="204" y="215" font-family="monospace" font-size="10" fill="#FFFFFF">2. search_submitted (79%)</text>
    <rect x="196" y="234" width="290" height="22" fill="#3B4D5E" />
    <text x="204" y="249" font-family="monospace" font-size="10" fill="#FFFFFF">4. product_viewed (64%)</text>
    <rect x="196" y="268" width="180" height="22" fill="#7C2D26" />
    <text x="204" y="283" font-family="monospace" font-size="10" fill="#FFFFFF">6. add_to_cart (27%)</text>
    <rect x="196" y="302" width="115" height="22" fill="#2E5A3C" />
    <text x="204" y="317" font-family="monospace" font-size="10" fill="#FFFFFF">8. order_placed (14%)</text>
  </g>
</svg>
