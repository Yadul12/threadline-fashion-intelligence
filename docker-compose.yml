version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: threadline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threadline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-threadline_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-threadline}
    ports:
      - "5432:5432"
    volumes:
      - threadline_pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threadline}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: threadline-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-threadline}:${POSTGRES_PASSWORD:-threadline_dev_pw}@postgres:5432/${POSTGRES_DB:-threadline}
      MIXPANEL_TOKEN: ${MIXPANEL_TOKEN:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: threadline-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_MIXPANEL_TOKEN: ${NEXT_PUBLIC_MIXPANEL_TOKEN:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  threadline_pgdata:
